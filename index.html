<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsmanMertGaming Store</title>
    <style>
        /* CSS GÖZ DOSTU DARK TEMA */
        body { 
            background-color: #1e1e1e; /* Tam siyah değil, koyu gri */
            color: #d1d1d1; /* Parlak beyaz değil, yumuşak grimsi beyaz */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Modern ve okunması kolay font */
            text-align: center; 
            margin: 0; 
            padding: 0; 
        }

        header { 
            background: #252526; /* Başlık için biraz daha açık gri */
            padding: 40px 20px; 
            border-bottom: 3px solid #007acc; /* Göz yormayan mavi bir çizgi */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 { margin: 0; font-size: 2.5em; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        .subtitle { color: #a1a1a1; margin-top: 10px; font-weight: normal; }
        .warning-text { color: #ffcc00; font-size: 0.85em; font-weight: bold; margin-bottom: 12px; display: block; } /* Uyarı rengi turuncu-sarı */

        #app-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            padding: 50px; 
            gap: 30px; 
        }

        .app-card { 
            background: #2d2d2d; /* Kartlar için orta gri */
            border: 1px solid #3e3e42; /* Hafif bir çerçeve */
            border-radius: 12px; 
            padding: 30px; 
            width: 290px; 
            transition: all 0.3s ease; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .app-card:hover { 
            border-color: #007acc; /* Üzerine gelince mavi çerçeve */
            transform: translateY(-8px); 
            box-shadow: 0 12px 24px rgba(0,122,204,0.3);
        }

        .app-card h2 { color: #fff; margin-top: 0; font-size: 1.6em; margin-bottom: 8px; }
        .app-card span { display: block; color: #00d4ff; font-weight: bold; margin-bottom: 18px; font-size: 0.95em; }
        .app-card p { color: #b1b1b1; font-size: 0.95em; min-height: 50px; line-height: 1.6; }

        .btn { 
            background-color: #007acc; /* Göz yormayan kurumsal mavi */
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            text-decoration: none; 
            display: inline-block; 
            transition: background 0.2s; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        .btn:hover { background-color: #005a9e; } /* Üzerine gelince daha koyu mavi */
    </style>
</head>
<body>

    <header>
        <h1>OsmanMertGaming Store</h1>
        <p class="subtitle">Efsane Yazılımlar ve Şaka Virüsleri Mağazası</p>
    </header>

    <div id="app-container">
        </div>

    <script>
        const uygulamalar = [
            { "ad": "DnsJava", "dil": "Java", "detay": "Hızlı DNS yönetimi.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/DnsJava.jar" },
            { "ad": "Dns Yönetici", "dil": "Batch", "detay": "Yönetici olarak çalıştırıcı.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/DnsJavay%C4%B1Y%C3%B6neticiOlarak%C3%87al%C4%B1%C5%9Ft%C4%B1r.bat" },
            { "ad": "EZPC Turkish", "dil": "PowerShell", "detay": "Şaka Virüsü: Sistem siliniyor simülasyonu!", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/EZPC%20Turkish.exe" },
            { "ad": "Isıtıcı Inside", "dil": "PowerShell", "detay": "İşlemci test aracı (Intel için).", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/Is%C4%B1t%C4%B1c%C4%B1Inside.exe" },
            { "ad": "JavaPlayer", "dil": "Android APK", "detay": "Mobil medya oynatıcı.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/JavaPlayer.apk" },
            { "ad": "OMGF Düzenleyici", "dil": "OMGF/EXE", "detay": "OMGF kodlarını yazmak için editör.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/OMGF%20D%C3%BCzenleyici.exe" },
            { "ad": "OMGPaint", "dil": "PowerShell", "detay": "Hızlı çizim uygulaması.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/OMGPaint.exe" },
            { "ad": "PSCPU-Z", "dil": "PowerShell", "detay": "Detaylı CPU bilgisi verir.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PSCPU-Z.exe" },
            { "ad": "PSGPU-Z", "dil": "PowerShell", "detay": "Ekran kartı verilerini listeler.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PSGPU-Z.exe" },
            { "ad": "Cable Correctly", "dil": "PowerShell", "detay": "Kabloları doğru takma oyunu.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PlugTheCableCorretly.exe" },
            { "ad": "ShieldPy", "dil": "Python", "detay": "OsmanMertGaming Antivirüs sistemi.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/ShieldPy.exe" }
        ];

        const container = document.getElementById('app-container');

        uygulamalar.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
                <h2>${app.ad}</h2>
                <span>Dil: ${app.dil}</span>
                <p>${app.detay}</p>
                <span class="warning-text">⚠️ Sertifika uyarısı verebilir!</span>
                <a href="${app.link}" class="btn" download>HEMEN İNDİR</a>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
