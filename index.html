<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsmanMertGaming Store</title>
    <style>
        body { 
            background-color: #1e1e1e; 
            color: #d1d1d1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background: #252526; 
            padding: 40px 20px; 
            border-bottom: 3px solid #007acc; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { margin: 0; font-size: 2.5em; color: #fff; }
        .subtitle { color: #a1a1a1; margin-top: 10px; }
        .warning-text { color: #ffcc00; font-size: 0.85em; font-weight: bold; margin-bottom: 12px; display: block; }
        #app-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            padding: 50px; 
            gap: 30px; 
        }
        .app-card { 
            background: #2d2d2d; 
            border: 1px solid #3e3e42; 
            border-radius: 12px; 
            padding: 30px; 
            width: 290px; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .app-card:hover { 
            border-color: #007acc; 
            transform: translateY(-8px); 
            box-shadow: 0 12px 24px rgba(0,122,204,0.3);
        }
        .app-card h2 { color: #fff; margin-top: 0; font-size: 1.6em; }
        .app-card span { display: block; color: #00d4ff; font-weight: bold; margin-bottom: 18px; }
        .app-card p { color: #b1b1b1; font-size: 0.95em; min-height: 50px; }
        .btn { 
            background-color: #007acc; 
            color: #fff; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            text-decoration: none; 
            display: inline-block; 
            font-size: 1em;
        }
        .btn:hover { background-color: #005a9e; }
    </style>
</head>
<body>
    <header>
        <h1>OsmanMertGaming Store</h1>
        <p class="subtitle">Efsane Yazılımlar ve Şaka Virüsleri Mağazası</p>
    </header>
    <div id="app-container"></div>
    <script>
        const uygulamalar = [
            { "ad": "DnsJava", "dil": "Java", "detay": "Hızlı DNS yönetimi.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/DnsJava.jar" },
            { "ad": "Dns Yönetici", "dil": "Batch", "detay": "Yönetici olarak çalıştırıcı.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/DnsJavay%C4%B1Y%C3%B6neticiOlarak%C3%87al%C4%B1%C5%9Ft%C4%B1r.bat" },
            { "ad": "EZPC Turkish", "dil": "PowerShell", "detay": "Şaka Virüsü: Sistem siliniyor simülasyonu!", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/EZPC%20Turkish.exe" },
            { "ad": "Isıtıcı Inside", "dil": "PowerShell", "detay": "İşlemci test aracı (Intel için).", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/Is%C4%B1t%C4%B1c%C4%B1Inside.exe" },
            { "ad": "JavaPlayer", "dil": "Android Java", "detay": "Mobil medya oynatıcı.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/JavaPlayer.apk" },
            { "ad": "OMGF Düzenleyici", "dil": "Python", "detay": "OMGF kodlarını yazmak için editör.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/OMGF%20D%C3%BCzenleyici.exe" },
            { "ad": "OMGPaint", "dil": "PowerShell", "detay": "Hızlı çizim uygulaması.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/OMGPaint.exe" },
            { "ad": "PSCPU-Z", "dil": "PowerShell", "detay": "Detaylı CPU bilgisi verir.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PSCPU-Z.exe" },
            { "ad": "PSGPU-Z", "dil": "PowerShell", "detay": "Ekran kartı verilerini listeler.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PSGPU-Z.exe" },
            { "ad": "Plug The Cable Correctly", "dil": "PowerShell", "detay": "Kabloları doğru takma oyunu.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/PlugTheCableCorretly.exe" },
            { "ad": "ShieldPy", "dil": "Python", "detay": "OsmanMertGaming Antivirüs sistemi.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/raw/main/ShieldPy.exe" },
            { "ad": "OMGAssistant", "dil": "Python", "detay": "OsmanMertGaming Asistant Uygulaması.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/releases/download/1.0/OMGAssistant.exe"},
            { "ad": "FFPlayer", "dil": "Python", "detay": "FFmpeg Destekli Video Oynatıcı.", "link": "https://github.com/osmanmertgaming6134/OsmanMertGamingStore/releases/download/v1.0/FFPlayer.exe"}
            ];
        const container = document.getElementById('app-container');
        uygulamalar.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
                <h2>${app.ad}</h2>
                <span>Dil: ${app.dil}</span>
                <p>${app.detay}</p>
                <span class="warning-text">⚠️ Sertifika uyarısı verebilir!</span>
                <a href="${app.link}" class="btn" download>HEMEN İNDİR</a>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
