<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsmanMertGaming Store</title>
    <style>
        /* CSS BURADA */
        body {
            background-color: #0d0d0d;
            color: #00ff41; /* Matrix yeşili gibi, tam bir hacker havası! */
            font-family: 'Consolas', 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1a1a1a;
            padding: 40px 20px;
            border-bottom: 4px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; }
        .subtitle { color: #888; margin-top: 10px; }

        #app-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 40px;
            gap: 25px;
        }

        .app-card {
            background: #161616;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            width: 280px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            border-color: #00ff41;
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.3);
        }

        .app-card h2 { color: #fff; margin-top: 0; }
        .app-card span { display: block; color: #ff003c; font-weight: bold; margin-bottom: 15px; }
        .app-card p { color: #ccc; font-size: 0.95em; line-height: 1.5; }

        .btn {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .btn:hover { background: #00cc33; }
    </style>
</head>
<body>

    <header>
        <h1>OsmanMertGaming Store</h1>
        <p class="subtitle">En Güçlü OMGF ve Yazılım Projeleri</p>
    </header>

    <div id="app-container">
        <!-- Uygulamalar JS ile buraya gelecek -->
    </div>

    <script>
        // JS VE VERİ (JSON MANTIĞI) BURADA
        const uygulamalar = [
            { "ad": "DnsJava", "dil": "Java", "detay": "Hızlı ve güvenli DNS yönetimi." },
            { "ad": "EZPC", "dil": "PowerShell", "detay": "Dikkat! Bilgisayarını 'hackleyebilir' (Tabii ki şaka!)." },
            { "ad": "Isıtıcı Inside", "dil": "PowerShell", "detay": "İşlemciyi son hızda test eder. (Intel-Only)" },
            { "ad": "JavaPlayer (APK)", "dil": "Java/Android", "detay": "Mobil medya oynatma aracı." },
            { "ad": "OMGF 2.0", "dil": "Python", "detay": "Efsane dilin geliştirilmiş versiyonu." },
            { "ad": "OMGPaint", "dil": "PowerShell", "detay": "En hızlı çizim ve boyama uygulaması." },
            { "ad": "PSCPU-Z", "dil": "PowerShell", "detay": "İşlemci detaylarını anında raporlar." },
            { "ad": "PSGPU-Z", "dil": "PowerShell", "detay": "Ekran kartı verilerini listeler." },
            { "ad": "Plug The Cable Correctly", "dil": "PowerShell", "detay": "Dikkat! Kabloları doğru takmalısın." },
            { "ad": "ShieldPy", "dil": "Python", "detay": "OsmanMertGaming imzalı antivirüs sistemi." }
        ];

        const container = document.getElementById('app-container');

        uygulamalar.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            card.innerHTML = `
                <h2>${app.ad}</h2>
                <span>Dil: ${app.dil}</span>
                <p>${app.detay}</p>
                <button class="btn" onclick="alert('${app.ad} yakında indirilebilir!')">İncele</button>
            `;
            container.appendChild(card);
        });
    </script>

</body>
</html>
